name: Build CineDrive

on:
  push:
    branches: [cinedrive]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinedrive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CineDrive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CineDrive-apk
          path: CineDrive.apk
          retention-days: 1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cinedrive-${{ github.run_number }}
          name: CineDrive build ${{ github.run_number }}
          files: CineDrive.apk
