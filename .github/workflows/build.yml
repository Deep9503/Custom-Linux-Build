name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Only one build at a time; a newer push cancels an older running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle ad-block filter lists
        run: |
          mkdir -p app/src/main/assets/filters
          cd app/src/main/assets/filters
          curl -fsSL --retry 3 https://easylist.to/easylist/easylist.txt -o easylist.txt || echo "easylist download failed"
          curl -fsSL --retry 3 https://easylist.to/easylist/easyprivacy.txt -o easyprivacy.txt || echo "easyprivacy download failed"
          curl -fsSL --retry 3 "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=adblockplus&showintro=0&mimetype=plaintext" -o peterlowe.txt || echo "peter lowe download failed"
          wc -l *.txt || true

      - name: Check ad-block engine against real lists
        run: |
          mkdir -p /tmp/fc
          javac -d /tmp/fc app/src/main/java/com/experiment/autobrowser/FilterEngine.java ci/FilterCheck.java
          java -cp /tmp/fc com.experiment.autobrowser.FilterCheck app/src/main/assets/filters/*.txt || true

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoBrowser.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoBrowser-apk
          path: AutoBrowser.apk
          retention-days: 1  # the APK is kept in Releases anyway

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto Browser build ${{ github.run_number }}
          files: AutoBrowser.apk
